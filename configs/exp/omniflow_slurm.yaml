name: omniflow-slurm
workdir: /Users/zirui/code/OmniFlow-amd
metrics_interval_sec: 5
warmup_steps: 2
gpu:
  backend: auto
env_check:
  enabled: false
env:
  DOCKER_IMAGE: docker.io/rocm/primus:v25.9_gfx942
  CONFIG: examples/debug_fsdp2_new2_5b_sp.yml
slurm:
  out_path_template: logs/omniflow.%j.out
  follow: false
  poll_interval_sec: 10
  wait_for_log_timeout_sec: 1800
command:
  - sbatch
  - examples/run_slurm.sh
